<!doctype html><html><head><meta charset="utf-8"><title>Nautilus viewport QA</title><style>html,body{margin:0;padding:0;background:#111619}iframe{display:block;border:0}</style></head><body><script type="module">const query=new URLSearchParams(location.search);const width=query.get('size')==='1920'?1920:1440;const height=width===1920?1080:900;document.body.style.width=`${width}px`;document.body.style.height=`${height}px`;const frame=document.createElement('iframe');frame.title='Nautilus test viewport';frame.width=String(width);frame.height=String(height);frame.src='/';document.body.append(frame);const scale=Math.min(1,innerWidth/width);frame.style.transformOrigin='top left';frame.style.transform=`scale(${scale})`;document.body.style.width='100%';document.body.style.height=`${height*scale}px`;</script></body></html>
